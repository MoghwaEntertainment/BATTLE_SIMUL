<svg width="100%" viewBox="0 0 680 620" role="img">
<title>BattleSimulation.Step() 1 tick 처리 순서</title>
<desc>상태 처리, AI 판단, 행동 시작, 진행, 겹침 해소, 타격 해결, 강제 중단과 종료, 사망과 승패 확정 순서로 실행되며 오른쪽에 Decide, DamageFormula, ApplyBuildup, EndBattle 같은 보조 함수가 연결됨</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node c-purple">
<rect x="40" y="20" width="330" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="205" y="38" text-anchor="middle" dominant-baseline="central">UpdateTimers() · ConfirmDeaths()</text>
<text class="ts" x="205" y="56" text-anchor="middle" dominant-baseline="central">상태이상 감소·중독·회복·사망</text>
</g>
<line x1="205" y1="74" x2="205" y2="88" class="arr" marker-end="url(#arrow)"/>
<g class="node c-purple">
<rect x="40" y="90" width="330" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="205" y="108" text-anchor="middle" dominant-baseline="central">UpdateTargets() · CollectDecisions()</text>
<text class="ts" x="205" y="126" text-anchor="middle" dominant-baseline="central">3 tick마다 타겟·AI 의도 수집</text>
</g>
<line x1="372" y1="116" x2="406" y2="116" class="arr" marker-end="url(#arrow)"/>
<g class="node c-coral">
<rect x="410" y="90" width="230" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="525" y="108" text-anchor="middle" dominant-baseline="central">Decide() → BuildPlan()</text>
<text class="ts" x="525" y="126" text-anchor="middle" dominant-baseline="central">AiCondition·ResourceRules</text>
</g>
<line x1="205" y1="144" x2="205" y2="158" class="arr" marker-end="url(#arrow)"/>
<g class="node c-purple">
<rect x="40" y="160" width="330" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="205" y="178" text-anchor="middle" dominant-baseline="central">ApplyDecisions() → StartAction()</text>
<text class="ts" x="205" y="196" text-anchor="middle" dominant-baseline="central">자원 재검사·차감·행동 시작</text>
</g>
<line x1="205" y1="214" x2="205" y2="228" class="arr" marker-end="url(#arrow)"/>
<g class="node c-purple">
<rect x="40" y="230" width="330" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="205" y="248" text-anchor="middle" dominant-baseline="central">AdvanceActions()</text>
<text class="ts" x="205" y="266" text-anchor="middle" dominant-baseline="central">진행시간·이동·추적·타격 시점</text>
</g>
<line x1="205" y1="284" x2="205" y2="298" class="arr" marker-end="url(#arrow)"/>
<g class="node c-purple">
<rect x="40" y="300" width="330" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="205" y="318" text-anchor="middle" dominant-baseline="central">ResolveOverlaps()</text>
<text class="ts" x="205" y="336" text-anchor="middle" dominant-baseline="central">겹침 해소·전장 경계</text>
</g>
<line x1="205" y1="354" x2="205" y2="368" class="arr" marker-end="url(#arrow)"/>
<g class="node c-purple">
<rect x="40" y="370" width="330" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="205" y="388" text-anchor="middle" dominant-baseline="central">ResolveHits() → ApplyHit()</text>
<text class="ts" x="205" y="406" text-anchor="middle" dominant-baseline="central">무적·가드·피해·강인도(경직 중 무적)·동시 교환</text>
</g>
<line x1="372" y1="396" x2="406" y2="396" class="arr" marker-end="url(#arrow)"/>
<g class="node c-coral">
<rect x="410" y="370" width="230" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="525" y="388" text-anchor="middle" dominant-baseline="central">DamageFormula.Compute()</text>
<text class="ts" x="525" y="406" text-anchor="middle" dominant-baseline="central">대미지메이커 공식</text>
</g>
<path d="M372 414 L390 414 L390 466 L406 466" fill="none" class="arr" marker-end="url(#arrow)"/>
<line x1="205" y1="424" x2="205" y2="438" class="arr" marker-end="url(#arrow)"/>
<g class="node c-purple">
<rect x="40" y="440" width="330" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="205" y="458" text-anchor="middle" dominant-baseline="central">ApplyInterrupts() · FinishActions()</text>
<text class="ts" x="205" y="476" text-anchor="middle" dominant-baseline="central">강제 중단·콤보 초기화·행동 종료</text>
</g>
<g class="node c-coral">
<rect x="410" y="440" width="230" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="525" y="458" text-anchor="middle" dominant-baseline="central">ApplyBuildup()</text>
<text class="ts" x="525" y="476" text-anchor="middle" dominant-baseline="central">상처·중독·빙결 누적</text>
</g>
<line x1="205" y1="494" x2="205" y2="508" class="arr" marker-end="url(#arrow)"/>
<g class="node c-purple">
<rect x="40" y="510" width="330" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="205" y="528" text-anchor="middle" dominant-baseline="central">ConfirmDeaths() · CheckEnd()</text>
<text class="ts" x="205" y="546" text-anchor="middle" dominant-baseline="central">사망 확정·승패·시간 초과</text>
</g>
<line x1="372" y1="536" x2="406" y2="536" class="arr" marker-end="url(#arrow)"/>
<g class="node c-coral">
<rect x="410" y="510" width="230" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="525" y="528" text-anchor="middle" dominant-baseline="central">EndBattle()</text>
<text class="ts" x="525" y="546" text-anchor="middle" dominant-baseline="central">BattleResult 생성</text>
</g>
<text class="ts" x="40" y="592" dominant-baseline="central">↻ 끝나지 않았으면 tick+1 후 다음 Step()</text>
<rect class="c-purple" x="400" y="586" width="12" height="12" rx="2" stroke-width="0.5"/>
<text class="ts" x="418" y="592" dominant-baseline="central">tick 단계</text>
<rect class="c-coral" x="500" y="586" width="12" height="12" rx="2" stroke-width="0.5"/>
<text class="ts" x="518" y="592" dominant-baseline="central">호출 함수</text>
</svg>
