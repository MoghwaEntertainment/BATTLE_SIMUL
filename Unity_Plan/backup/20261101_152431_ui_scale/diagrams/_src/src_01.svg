<text class="th" x="340" y="250" text-anchor="middle" dominant-baseline="central">BatchCoordinator</text>
<text class="ts" x="340" y="268" text-anchor="middle" dominant-baseline="central">고속 반복 N회</text>
</g>
<g class="node c-teal">
<rect x="460" y="230" width="180" height="56" rx="8" stroke-width="0.5"/>
