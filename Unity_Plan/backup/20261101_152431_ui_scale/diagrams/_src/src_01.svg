<text class="th" x="340" y="350" text-anchor="middle" dominant-baseline="central">BattleSimulation.Step()</text>
<text class="ts" x="340" y="368" text-anchor="middle" dominant-baseline="central">1 tick = 1/30초 진행</text>
</g>
