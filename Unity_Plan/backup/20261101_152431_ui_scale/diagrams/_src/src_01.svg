<rect x="60" y="454" width="270" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="195" y="471" text-anchor="middle" dominant-baseline="central">UnityConsoleSink</text>
<text class="ts" x="195" y="489" text-anchor="middle" dominant-baseline="central">Console·화면 로그</text>
</g>
