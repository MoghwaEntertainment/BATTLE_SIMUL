<rect x="40" y="420" width="600" height="170" rx="16" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="ts" x="60" y="438" dominant-baseline="central">IBattleEventSink.OnEvent(in BattleEvent) 구독자</text>
