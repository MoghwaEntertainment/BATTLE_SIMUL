<rect x="350" y="518" width="270" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="485" y="535" text-anchor="middle" dominant-baseline="central">SkillStatsCollector</text>
<text class="ts" x="485" y="553" text-anchor="middle" dominant-baseline="central">스킬별 집계 → 결과</text>
</g>
<line x1="195" y1="570" x2="195" y2="616" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal">
<rect x="60" y="620" width="270" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="195" y="637" text-anchor="middle" dominant-baseline="central">AttackFx.Spawn / Advance</text>
<text class="ts" x="195" y="655" text-anchor="middle" dominant-baseline="central">막대·착탄 연출 (화면 시간 기준)</text>
</g>
<line x1="332" y1="645" x2="346" y2="645" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal">
<rect x="350" y="620" width="270" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="485" y="637" text-anchor="middle" dominant-baseline="central">CombatantView</text>
<text class="ts" x="485" y="655" text-anchor="middle" dominant-baseline="central">몸 기울임·내딛기·착탄 점멸</text>
</g>
<rect class="box" x="40" y="694" width="12" height="12" rx="2" stroke-width="0.5"/>
<text class="ts" x="58" y="700" dominant-baseline="central">외부 파일·도구</text>
<rect class="c-teal" x="200" y="694" width="12" height="12" rx="2" stroke-width="0.5"/>
<text class="ts" x="218" y="700" dominant-baseline="central">Unity 연결 (ARPG.Runtime)</text>
