<svg width="100%" viewBox="0 0 680 730" role="img">
<title>ARPG 전투 시뮬레이터 전체 구조</title>
<desc>엑셀 테이블이 변환기로 JSON이 되고, DataLoader와 DataCatalog를 거쳐 세 가지 실행기가 BattleSimulation.Step을 호출하며, 발생한 이벤트는 네 종류의 구독자로 전달되는 흐름. ViewEventSink 는 AttackFx 로 공격 연출을 만들고 착탄 시 CombatantView 를 점멸시킨다</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="node">
<rect class="box" x="40" y="30" width="170" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="125" y="50" text-anchor="middle" dominant-baseline="central">엑셀 테이블</text>
<text class="ts" x="125" y="68" text-anchor="middle" dominant-baseline="central">Table_ARPG/*.xlsm</text>
</g>
<line x1="212" y1="58" x2="246" y2="58" class="arr" marker-end="url(#arrow)"/>
<g class="node">
<rect class="box" x="250" y="30" width="170" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="335" y="50" text-anchor="middle" dominant-baseline="central">export_tables.py</text>
<text class="ts" x="335" y="68" text-anchor="middle" dominant-baseline="central">검증·단위 변환</text>
</g>
<line x1="422" y1="58" x2="456" y2="58" class="arr" marker-end="url(#arrow)"/>
<g class="node">
<rect class="box" x="460" y="30" width="180" height="56" rx="8" stroke-width="0.5"/>
