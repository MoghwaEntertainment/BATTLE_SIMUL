<text class="ts" x="550" y="68" text-anchor="middle" dominant-baseline="central">StreamingAssets/ARPG</text>
</g>
<path d="M550 88 L550 108 L200 108 L200 126" fill="none" class="arr" marker-end="url(#arrow)"/>
<g class="node c-teal">
<rect x="100" y="130" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="200" y="150" text-anchor="middle" dominant-baseline="central">DataLoader.Load()</text>
<text class="ts" x="200" y="168" text-anchor="middle" dominant-baseline="central">JSON·rules.json 읽기</text>
</g>
<line x1="302" y1="158" x2="376" y2="158" class="arr" marker-end="url(#arrow)"/>
<g class="node c-purple">
