<text class="ts" x="480" y="168" text-anchor="middle" dominant-baseline="central">읽기 전용 정의 사전</text>
</g>
<line x1="480" y1="188" x2="480" y2="207" stroke="var(--s)" stroke-width="1.5" fill="none"/>
<line x1="130" y1="207" x2="550" y2="207" stroke="var(--s)" stroke-width="1.5" fill="none"/>
<line x1="130" y1="207" x2="130" y2="226" class="arr" marker-end="url(#arrow)"/>
