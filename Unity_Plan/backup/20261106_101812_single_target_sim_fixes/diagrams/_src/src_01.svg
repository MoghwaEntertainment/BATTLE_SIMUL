<text class="ts" x="448" y="700" dominant-baseline="central">순수 C# 코어 (ARPG.Core)</text>
<rect class="box" x="40" y="730" width="600" height="48" rx="6"/><text class="th" x="340" y="746" text-anchor="middle">AIHarness CLI / MCP → harness.py → CoreRunner / Unity Verify</text><text class="ts" x="340" y="765" text-anchor="middle">Excel staging · actual Core · JSON execution reports</text><text class="th" x="340" y="820" text-anchor="middle">GameConfig.xlsm → gameconfig.json → GameConfigRules.Apply</text><text class="ts" x="340" y="840" text-anchor="middle">Unity / CoreRunner: defaults → rules.json → GameConfig</text><text class="ts" x="40" y="874">ABILITY 105 / 106 → BUFF effects → DataCatalog.BuildBuffs</text><text class="ts" x="40" y="895">HP_RECOVERY → ApplyBuff: MaxHp 비율 즉시 회복</text><text class="ts" x="40" y="916">ADD_AGGRO → ActiveBuff.SourceId / ApplyOrder → TauntTarget</text><text class="ts" x="40" y="962">r9: SupportTarget → 단일 치유 / Cleanse · FP 비용 증가</text><text class="ts" x="40" y="982">스킬 전용 강인도 / 빙결 유발 · 원거리 단일 / 범위 타격</text></svg>
